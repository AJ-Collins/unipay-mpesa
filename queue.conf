[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
logfile_backups=0
pidfile=/var/run/supervisord.pid
stderr_logfile=/dev/null
stdout_logfile=/dev/null

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

; ===== OmniBase Queue Worker =====
[program:omnibase-queue]
command=php /var/www/html/yii queue/listen --verbose=1 --color=0
directory=/var/www/html
autostart=true
autorestart=true
startretries=3
numprocs=1
process_name=%(program_name)s_%(process_num)s
priority=999
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ===== OmniBase Scheduler (Cron-like Task Runner) =====
[program:omnibase-scheduler]
command=php /var/www/html/yii scheduler/run
directory=/var/www/html
autostart=true
autorestart=true
startretries=10
numprocs=1
process_name=%(program_name)s
priority=998
user=www-data
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0